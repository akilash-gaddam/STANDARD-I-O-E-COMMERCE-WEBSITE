services:
  - type: web
    name: standard-io-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: standard-io-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.13.0
    healthCheckPath: /docs
    autoDeploy: true

  - type: web
    name: standard-io-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://standard-io-api.onrender.com/api/*
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    autoDeploy: true

databases:
  - name: standard-io-db
    plan: free
    databaseName: standard_io
    user: standard_io
    region: oregon